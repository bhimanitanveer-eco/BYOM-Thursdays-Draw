<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYOM Thursdays Raffle</title>

<style>
:root{
  --green:#064f3b;
  --deep:#033b2f;
  --cream:#f7f4ea;
  --sage:#9caf94;
  --gold:#f0c85a;
  --burgundy:#b34a57;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:
    radial-gradient(circle at top left, rgba(240,200,90,.15), transparent 28%),
    linear-gradient(135deg,var(--deep),var(--green));
  color:white;
  min-height:100vh;
  overflow-x:hidden;
}

.container{
  width:min(1000px,95vw);
  margin:auto;
  padding:24px 0 40px;
  text-align:center;
}

.badge{
  display:inline-block;
  border:2px solid rgba(255,255,255,.7);
  border-radius:999px;
  padding:8px 18px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:14px;
}

h1{
  margin:0;
  font-size:clamp(48px,8vw,90px);
  line-height:.9;
  text-transform:uppercase;
}

.subtitle{
  margin-top:10px;
  font-size:clamp(18px,2vw,28px);
  font-weight:700;
}

.controls{
  display:flex;
  gap:14px;
  justify-content:center;
  flex-wrap:wrap;
  margin:28px 0 10px;
}

button{
  border:none;
  border-radius:999px;
  padding:16px 28px;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  transition:.18s ease;
}

button:hover{
  transform:translateY(-2px);
}

.gents{
  background:var(--green);
  color:white;
}

.ladies{
  background:var(--sage);
  color:#033b2f;
}

.spin{
  background:var(--burgundy);
  color:white;
  padding:20px 44px;
  font-size:28px;
  margin-top:18px;
}

.wheel-wrap{
  position:relative;
  width:min(720px,92vw);
  height:min(720px,92vw);
  margin:10px auto 22px;
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  background:var(--cream);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
}

.pointer{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:28px solid transparent;
  border-right:28px solid transparent;
  border-top:65px solid var(--burgundy);
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));
  z-index:5;
}

.center{
  position:absolute;
  inset:50% auto auto 50%;
  transform:translate(-50%,-50%);
  width:145px;
  height:145px;
  border-radius:50%;
  background:var(--green);
  border:10px solid var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:1000;
  text-transform:uppercase;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}

.status{
  font-size:clamp(32px,5vw,64px);
  font-weight:1000;
  margin:8px 0 16px;
}

.winner-box{
  width:min(700px,92vw);
  margin:auto;
  background:linear-gradient(135deg,var(--green),var(--deep));
  border-radius:28px;
  padding:22px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

.winner-label{
  font-size:16px;
  font-weight:900;
  letter-spacing:.08em;
  opacity:.9;
}

#winner{
  margin-top:8px;
  font-size:clamp(42px,6vw,74px);
  font-weight:1000;
  word-break:break-word;
}

.footer{
  margin-top:26px;
  font-weight:900;
  letter-spacing:.08em;
  font-size:clamp(20px,2vw,30px);
}

.hidden-admin{
  margin-top:18px;
  opacity:.55;
  font-size:12px;
}

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:99;
}

.piece{
  position:absolute;
  top:-20px;
  width:10px;
  height:16px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg)}
}

.celebrate{
  animation:pop .65s ease-in-out 3;
}

@keyframes pop{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

@media(max-width:700px){
  .controls{
    flex-direction:column;
    align-items:center;
  }

  button{
    width:min(420px,90vw);
  }

  .spin{
    width:min(500px,92vw);
  }
}
</style>
</head>

<body>

<div class="container">

<div class="badge">BE GREEN, IT’S DEEN</div>

<h1>BYOM Thursdays</h1>

<div class="subtitle">Live Raffle Draw</div>

<div class="controls">
  <button class="gents" onclick="loadPreset('gents')">Load Gents’ Raffle</button>
  <button class="ladies" onclick="loadPreset('ladies')">Load Ladies’ Raffle</button>
</div>

<button class="spin" id="spinButton" onclick="spin()">SPIN THE WHEEL 🎡</button>

<div class="status" id="status">Choose a raffle list</div>

<div class="wheel-wrap">
  <div class="pointer"></div>
  <canvas id="wheel" width="900" height="900"></canvas>
  <div class="center">Spin</div>
</div>

<div class="winner-box" id="winnerBox">
  <div class="winner-label">WINNING NAME</div>
  <div id="winner">Ready?</div>
</div>

<div class="footer">Small Changes, Big Impact ☕🌱</div>

<div class="hidden-admin">
Uses: data/gents.csv and data/ladies.csv
</div>

</div>

<div class="confetti" id="confetti"></div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let names = [];
let rotation = 0;
let spinning = false;
let idleRotation = 0;
let currentRaffle = "";

const colors = [
  "#064f3b",
  "#117b5a",
  "#9caf94",
  "#efe9d8",
  "#b34a57",
  "#f0c85a"
];

function parseCSV(text){
  const rows = text.split(/\\r?\\n/).filter(r => r.trim());
  return rows.map(r => r.split(",")[0].trim()).filter(Boolean);
}

function cleanNames(list){
  if(list.length && list[0].toLowerCase() === "name"){
    list.shift();
  }
  return list;
}

async function loadPreset(type){
  try{
    const res = await fetch("data/" + type + ".csv?cache=" + Date.now());
    const text = await res.text();

    names = cleanNames(parseCSV(text));

    currentRaffle = type === "gents"
      ? "Gents’ raffle loaded"
      : "Ladies’ raffle loaded";

    document.getElementById("status").innerHTML = currentRaffle;
    document.getElementById("winner").innerHTML = "Ready?";

    rotation = 0;
    drawWheel();

  }catch(e){
    alert("Could not load raffle file.");
  }
}

function drawEmptyWheel(){
  const w = canvas.width;
  const h = canvas.height;
  const cx = w/2;
  const cy = h/2;
  const r = 350;

  const total = 18;
  const slice = (Math.PI*2)/total;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(idleRotation);

  for(let i=0;i<total;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,i*slice,(i+1)*slice);
    ctx.closePath();

    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.88)";
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth = 18;
  ctx.strokeStyle = "#f7f4ea";
  ctx.stroke();
}

function drawWheel(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(names.length === 0){
    drawEmptyWheel();
    return;
  }

  const w = canvas.width;
  const h = canvas.height;
  const cx = w/2;
  const cy = h/2;
  const r = 350;

  const total = names.length;
  const slice = (Math.PI*2)/total;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);

  for(let i=0;i<total;i++){

    const start = i*slice;
    const end = start + slice;

    const bg = colors[i % colors.length];

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,start,end);
    ctx.closePath();

    ctx.fillStyle = bg;
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.9)";
    ctx.lineWidth = total > 120 ? 1 : 3;
    ctx.stroke();

    ctx.save();
    ctx.rotate(start + slice/2);

    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    const lightBg = (bg === "#efe9d8" || bg === "#f0c85a" || bg === "#9caf94");
    ctx.fillStyle = lightBg ? "#033b2f" : "#ffffff";

    const label = names[i].length > 18
      ? names[i].slice(0,18) + "…"
      : names[i];

    ctx.font =
      total > 160 ? "bold 10px Arial" :
      total > 100 ? "bold 12px Arial" :
      total > 60 ? "bold 14px Arial" :
      total > 30 ? "bold 18px Arial" :
      "bold 26px Arial";

    ctx.fillText(label, r-24, 0);

    ctx.restore();
  }

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.lineWidth = 18;
  ctx.strokeStyle = "#f7f4ea";
  ctx.stroke();
}

function spin(){

  if(spinning) return;

  if(names.length === 0){
    alert("Please load a raffle list first.");
    return;
  }

  spinning = true;

  document.getElementById("spinButton").disabled = true;
  document.getElementById("winner").innerHTML = "Spinning...";

  const total = names.length;
  const slice = (Math.PI*2)/total;

  const winnerIndex = Math.floor(Math.random()*total);

  const pointerAngle = -Math.PI/2;
  const sliceCenter = winnerIndex*slice + slice/2;

  const current = rotation % (Math.PI*2);

  let target = pointerAngle - sliceCenter;

  while(target <= current){
    target += Math.PI*2;
  }

  target += (7 + Math.floor(Math.random()*2)) * Math.PI*2;

  const start = rotation;
  const change = target - start;

  const duration = 5200;
  const startTime = performance.now();

  function easeOut(t){
    return 1 - Math.pow(1-t,3);
  }

  function animate(now){

    const elapsed = now - startTime;
    const t = Math.min(elapsed/duration,1);

    rotation = start + change * easeOut(t);

    drawWheel();

    if(t < 1){
      requestAnimationFrame(animate);
    }else{

      rotation = target % (Math.PI*2);

      drawWheel();

      showWinner(winnerIndex);

      spinning = false;
      document.getElementById("spinButton").disabled = false;
    }
  }

  requestAnimationFrame(animate);
}

function showWinner(index){

  const winner = names[index];

  document.getElementById("winner").innerHTML = winner;

  const box = document.getElementById("winnerBox");

  box.classList.remove("celebrate");
  void box.offsetWidth;
  box.classList.add("celebrate");

  launchConfetti();
}

function launchConfetti(){

  const container = document.getElementById("confetti");

  container.innerHTML = "";

  const confettiColors = [
    "#f0c85a",
    "#ffffff",
    "#9caf94",
    "#b34a57",
    "#064f3b"
  ];

  for(let i=0;i<180;i++){

    const piece = document.createElement("div");

    piece.className = "piece";

    piece.style.left = Math.random()*100 + "vw";

    piece.style.background =
      confettiColors[Math.floor(Math.random()*confettiColors.length)];

    piece.style.animationDuration =
      (2 + Math.random()*3) + "s";

    piece.style.transform =
      "rotate(" + Math.random()*360 + "deg)";

    container.appendChild(piece);
  }

  setTimeout(() => {
    container.innerHTML = "";
  },5200);
}

function idleAnimate(){

  if(names.length === 0 && !spinning){
    idleRotation += 0.0015;
    drawWheel();
  }

  requestAnimationFrame(idleAnimate);
}

drawWheel();
idleAnimate();
</script>

</body>
</html>
