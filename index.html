<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spinning Wheel</title>
    <style>
        #wheel {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            transform: rotate(0deg);
            transition: transform 4s ease-out;
        }
        .segment {
            position: absolute;
            width: 50%;
            height: 50%;
            background: transparent;
            border: 2px solid #000;
            clip-path: polygon(100% 0%, 0% 100%, 100% 100%);
        }
        #spinButton {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Spinning Wheel</h1>
    <div id="wheel"></div>
    <button id="spinButton">Spin</button>

    <script>
        const segments = ['Alice', 'Bob', 'Charlie', 'Diana', 'Eve', 'Frank'];
        const colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33A1', '#FFC300', '#DAF7A6'];
        const wheel = document.getElementById('wheel');

        // Create segments
        segments.forEach((name, index) => {
            const segment = document.createElement('div');
            segment.className = 'segment';
            segment.style.transform = `rotate(${index * (360 / segments.length)}deg)`;
            segment.style.backgroundColor = colors[index];
            wheel.appendChild(segment);
        });

        document.getElementById('spinButton').addEventListener('click', () => {
            const randomDeg = Math.floor(Math.random() * 360 + 360 * 5); // Spin at least 5 full turns
            wheel.style.transform = `rotate(${randomDeg}deg)`;
        });
    </script>
</body>
</html>
