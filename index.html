<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYOM Thursdays Raffle</title>

<style>
:root{
  --green:#064f3b;
  --deep:#033b2f;
  --cream:#f7f4ea;
  --sage:#9caf94;
  --gold:#f0c85a;
  --burgundy:#b34a57;
}

*{box-sizing:border-box}

html, body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:
    radial-gradient(circle at top left, rgba(240,200,90,.15), transparent 28%),
    linear-gradient(135deg,var(--deep),var(--green));
  color:white;
  overflow:hidden;
}

.container{
  width:min(1500px,96vw);
  height:100vh;
  margin:auto;
  padding:18px 20px;
  display:flex;
  flex-direction:column;
}

.header{
  flex:0 0 auto;
  text-align:center;
  padding:4px 0 8px;
}

.badge{
  display:inline-block;
  border:2px solid rgba(255,255,255,.7);
  border-radius:999px;
  padding:7px 18px;
  font-weight:800;
  letter-spacing:.08em;
  margin-bottom:10px;
}

h1{
  margin:0;
  font-size:clamp(46px,5.8vw,82px);
  line-height:.9;
  text-transform:uppercase;
  letter-spacing:.02em;
}

.subtitle{
  margin-top:8px;
  font-size:clamp(18px,2vw,28px);
  font-weight:700;
}

.main-layout{
  flex:1 1 auto;
  display:grid;
  grid-template-columns:430px 1fr;
  gap:32px;
  align-items:center;
  min-height:0;
}

.left-panel{
  text-align:left;
  background:rgba(247,244,234,.10);
  border:1px solid rgba(247,244,234,.18);
  border-radius:32px;
  padding:24px;
  box-shadow:0 18px 45px rgba(0,0,0,.20);
}

.right-panel{
  display:flex;
  justify-content:center;
  align-items:center;
  min-width:0;
  min-height:0;
}

.controls{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin:20px 0 16px;
}

button{
  border:2px solid rgba(247,244,234,.85);
  border-radius:999px;
  padding:15px 24px;
  font-size:20px;
  font-weight:1000;
  cursor:pointer;
  transition:.18s ease;
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

button:hover{transform:translateY(-2px)}
button:disabled{opacity:.55;cursor:not-allowed}

.gents{
  background:linear-gradient(135deg,#f7f4ea,#e9e1ca);
  color:var(--deep);
}
.ladies{
  background:linear-gradient(135deg,#c4d0b8,#9caf94);
  color:var(--deep);
}

.spin{
  background:linear-gradient(135deg,#c65b66,#a9474f);
  color:white;
  padding:20px 30px;
  font-size:28px;
  width:100%;
  margin-bottom:18px;
  border-color:rgba(255,255,255,.85);
  letter-spacing:.02em;
}

.status-card{
  margin-bottom:14px;
}

.status{
  font-size:clamp(18px,1.5vw,24px);
  font-weight:1000;
  line-height:1.05;
  text-transform:uppercase;
  letter-spacing:.06em;
  color:rgba(255,255,255,.92);
}

.small-status{
  font-size:20px;
  font-weight:800;
  opacity:.88;
  margin-bottom:18px;
}

.wheel-wrap{
  position:relative;
  width:min(680px,54vw,76vh);
  height:min(680px,54vw,76vh);
}

#wheel{
  width:100%;
  height:100%;
  border-radius:50%;
  background:transparent;
  filter:drop-shadow(0 24px 44px rgba(0,0,0,.35));
}

.pointer{
  position:absolute;
  top:-8px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:27px solid transparent;
  border-right:27px solid transparent;
  border-top:62px solid var(--burgundy);
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));
  z-index:5;
}

.center{
  position:absolute;
  inset:50% auto auto 50%;
  transform:translate(-50%,-50%);
  width:138px;
  height:138px;
  border-radius:50%;
  background:var(--green);
  border:8px solid var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:1000;
  text-transform:uppercase;
  box-shadow:0 10px 28px rgba(0,0,0,.35);
}

.winner-box{
  background:linear-gradient(135deg,#f7f4ea,#e8dec4);
  color:var(--deep);
  border-radius:28px;
  padding:20px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
  max-height:220px;
  overflow:hidden;
  border:2px solid rgba(255,255,255,.72);
}

.winner-label{
  font-size:16px;
  font-weight:900;
  letter-spacing:.08em;
  opacity:.9;
}

#winner{
  margin-top:8px;
  font-size:clamp(38px,4.6vw,66px);
  line-height:1.02;
  font-weight:1000;
  word-break:break-word;
}

.footer{
  margin-top:18px;
  font-weight:1000;
  letter-spacing:.06em;
  font-size:clamp(18px,1.65vw,24px);
  white-space:nowrap;
  text-align:center;
}

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:99;
}

.piece{
  position:absolute;
  top:-20px;
  width:10px;
  height:16px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{transform:translateY(110vh) rotate(720deg)}
}

@media(max-width:1100px){
  body{overflow:auto}
  .container{height:auto; min-height:100vh}
  .main-layout{grid-template-columns:1fr}
  .left-panel{text-align:center}
  .wheel-wrap{
    width:min(700px,92vw);
    height:min(700px,92vw);
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <div class="badge">BE GREEN, IT’S DEEN</div>
    <h1>BYOM Thursdays</h1>
    <div class="subtitle">Live Raffle Draw</div>
  </div>

  <div class="main-layout">

    <div class="left-panel">

      <div class="status-card">
        <div class="status" id="status">Choose a raffle list</div>
        <div class="small-status" id="countStatus"></div>
      </div>

      <div class="controls">
        <button class="gents" onclick="loadPreset('gents')">Load Gents’ Raffle</button>
        <button class="ladies" onclick="loadPreset('ladies')">Load Ladies’ Raffle</button>
      </div>

      <button class="spin" id="spinButton" onclick="spin()">SPIN THE WHEEL 🎡</button>

      <div class="winner-box">
        <div class="winner-label">WINNING NAME</div>
        <div id="winner">Ready?</div>
      </div>

      <div class="footer">Small Changes, Big Impact ☕🌱</div>

    </div>

    <div class="right-panel">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="900" height="900"></canvas>
        <div class="center">Spin</div>
      </div>
    </div>

  </div>

</div>

<div class="confetti" id="confetti"></div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let names = [];
let rotation = 0;
let spinning = false;
let idleRotation = 0;

const colors = [
  "#064f3b",
  "#117b5a",
  "#9caf94",
  "#efe9d8",
  "#b34a57",
  "#f0c85a"
];

function parseCSV(text){
  return text
    .replace(/\r/g, "")
    .split("\n")
    .map(line => line.trim())
    .filter(line => line.length > 0)
    .map(line => {
      if(line.includes(",")){
        return line.split(",")[0].replace(/^"|"$/g, "").trim();
      }
      return line.replace(/^"|"$/g, "").trim();
    });
}

function cleanNames(list){
  if(list.length && list[0].trim().toLowerCase() === "name"){
    list.shift();
  }
  return list.filter(Boolean);
}

async function loadPreset(type){
  try{
    const raffleLinks = {
  gents: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbLgOAWchYRCm0PVbyNXPls2jeIUOMfsncx8fk7HlFVA8Jdt5IVlN3c08kVW_hx6cOq_erMgn8IYH5/pubhtml?gid=0&single=true",
  ladies: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSbLgOAWchYRCm0PVbyNXPls2jeIUOMfsncx8fk7HlFVA8Jdt5IVlN3c08kVW_hx6cOq_erMgn8IYH5/pubhtml?gid=1817911782&single=true"
};

const res = await fetch(raffleLinks[type] + "&cache=" + Date.now());
    if(!res.ok) throw new Error("CSV not found");

    const text = await res.text();
    names = cleanNames(parseCSV(text));

    document.getElementById("status").innerHTML =
      type === "gents" ? "Gents’ raffle loaded" : "Ladies’ raffle loaded";

    document.getElementById("countStatus").innerHTML =
      names.length + " names loaded";

    document.getElementById("winner").innerHTML = "Ready?";

    rotation = 0;
    drawWheel();
  }catch(e){
    alert("Could not load raffle file. Please check data/" + type + ".csv");
  }
}

function wheelGeometry(){
  const cx = canvas.width/2;
  const cy = canvas.height/2;
  const r = 438; // larger radius fills canvas, removing the big white ring
  return {cx, cy, r};
}

function drawEmptyWheel(){
  const {cx, cy, r} = wheelGeometry();
  const total = 18;
  const slice = (Math.PI*2)/total;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(idleRotation);

  for(let i=0;i<total;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,i*slice,(i+1)*slice);
    ctx.closePath();

    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.88)";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r-4,0,Math.PI*2);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "rgba(255,255,255,.8)";
  ctx.stroke();
}

function drawWheel(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(names.length === 0){
    drawEmptyWheel();
    return;
  }

  const {cx, cy, r} = wheelGeometry();
  const total = names.length;
  const slice = (Math.PI*2)/total;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);

  for(let i=0;i<total;i++){
    const start = i*slice;
    const end = start + slice;
    const bg = colors[i % colors.length];

    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,start,end);
    ctx.closePath();

    ctx.fillStyle = bg;
    ctx.fill();

    ctx.strokeStyle = total > 120 ? "rgba(255,255,255,.30)" : "rgba(255,255,255,.88)";
    ctx.lineWidth = total > 120 ? 1 : 2.5;
    ctx.stroke();

    ctx.save();
    ctx.rotate(start + slice/2);

    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    const lightBg =
      bg === "#efe9d8" ||
      bg === "#f0c85a" ||
      bg === "#9caf94";

    ctx.fillStyle = lightBg ? "#033b2f" : "#ffffff";

    const label =
      names[i].length > 18
      ? names[i].slice(0,18) + "…"
      : names[i];

    ctx.font =
      total > 140 ? "bold 10px Arial" :
      total > 90 ? "bold 12px Arial" :
      total > 60 ? "bold 14px Arial" :
      total > 35 ? "bold 16px Arial" :
      "bold 24px Arial";

    ctx.fillText(label, r-20, 0);
    ctx.restore();
  }

  ctx.restore();

  ctx.beginPath();
  ctx.arc(cx,cy,r-4,0,Math.PI*2);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "rgba(255,255,255,.8)";
  ctx.stroke();
}

function spin(){
  if(spinning) return;

  if(names.length === 0){
    alert("Please load a raffle list first.");
    return;
  }

  spinning = true;
  document.getElementById("spinButton").disabled = true;
  document.getElementById("winner").innerHTML = "Spinning...";

  const total = names.length;
  const slice = (Math.PI*2)/total;
  const winnerIndex = Math.floor(Math.random()*total);

  const pointerAngle = -Math.PI/2;
  const sliceCenter = winnerIndex*slice + slice/2;
  const current = rotation % (Math.PI*2);

  let target = pointerAngle - sliceCenter;

  while(target <= current){
    target += Math.PI*2;
  }

  target += 8 * Math.PI*2;

  const start = rotation;
  const change = target - start;
  const duration = 5200;
  const startTime = performance.now();

  function easeOut(t){
    return 1 - Math.pow(1-t,3);
  }

  function animate(now){
    const elapsed = now - startTime;
    const t = Math.min(elapsed/duration,1);

    rotation = start + change * easeOut(t);
    drawWheel();

    if(t < 1){
      requestAnimationFrame(animate);
    }else{
      rotation = target % (Math.PI*2);
      drawWheel();
      showWinner(winnerIndex);
      spinning = false;
      document.getElementById("spinButton").disabled = false;
    }
  }

  requestAnimationFrame(animate);
}

function showWinner(index){
  document.getElementById("winner").innerHTML = names[index];
  launchConfetti();
}

function launchConfetti(){
  const container = document.getElementById("confetti");
  container.innerHTML = "";

  const confettiColors = [
    "#f0c85a",
    "#ffffff",
    "#9caf94",
    "#b34a57",
    "#064f3b"
  ];

  for(let i=0;i<160;i++){
    const piece = document.createElement("div");
    piece.className = "piece";
    piece.style.left = Math.random()*100 + "vw";
    piece.style.background =
      confettiColors[Math.floor(Math.random()*confettiColors.length)];
    piece.style.animationDuration =
      (2 + Math.random()*3) + "s";
    container.appendChild(piece);
  }

  setTimeout(() => {
    container.innerHTML = "";
  },5000);
}

function idleAnimate(){
  if(names.length === 0 && !spinning){
    idleRotation += 0.0015;
    drawWheel();
  }
  requestAnimationFrame(idleAnimate);
}

drawWheel();
idleAnimate();
</script>

</body>
</html>
