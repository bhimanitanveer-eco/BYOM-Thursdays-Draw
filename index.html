<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BYOM Thursdays Raffle</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#033b2f,#064f3b);
color:white;
text-align:center;
}
.container{
padding:20px;
}
button{
padding:14px 20px;
margin:8px;
border:none;
border-radius:999px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
.gents{background:#064f3b;color:white;}
.ladies{background:#8fa58a;color:#033b2f;}
.spin{background:#a9474f;color:white;font-size:24px;}
#winner{
font-size:48px;
font-weight:bold;
margin-top:20px;
}
canvas{
background:#f7f4ea;
border-radius:50%;
margin-top:20px;
width:600px;
height:600px;
max-width:90vw;
max-height:90vw;
}
</style>
</head>
<body>

<div class="container">
<h1>BYOM Thursdays</h1>
<p>Live Raffle Draw</p>

<button class="gents" onclick="loadCSV('gents')">Load Gents’ Raffle</button>
<button class="ladies" onclick="loadCSV('ladies')">Load Ladies’ Raffle</button>
<br>
<button class="spin" onclick="spin()">SPIN THE WHEEL 🎡</button>

<div id="winner">Choose a raffle list</div>

<canvas id="wheel" width="800" height="800"></canvas>
</div>

<script>
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');

let names = [];
let rotation = 0;
let spinning = false;

const colors = ['#064f3b','#8fa58a','#f7f4ea','#a9474f','#f3c85c'];

async function loadCSV(type){
  const response = await fetch('data/' + type + '.csv?' + Date.now());
  const text = await response.text();

  names = text.split('\n')
    .slice(1)
    .map(r => r.trim())
    .filter(Boolean);

  document.getElementById('winner').innerHTML =
    (type === 'gents' ? "Gents’" : "Ladies’") + " raffle loaded";

  drawWheel();
}

function drawWheel(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const cx = canvas.width/2;
  const cy = canvas.height/2;
  const radius = 350;

  const total = names.length || 18;
  const slice = (Math.PI*2)/total;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.rotate(rotation);

  for(let i=0;i<total;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,radius,i*slice,(i+1)*slice);
    ctx.closePath();

    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    ctx.strokeStyle = 'white';
    ctx.lineWidth = 2;
    ctx.stroke();

    if(names.length){
      ctx.save();
      ctx.rotate(i*slice + slice/2);
      ctx.textAlign='right';
      ctx.fillStyle='white';
      ctx.font='bold 16px Arial';
      ctx.fillText(names[i].slice(0,18), radius-20, 0);
      ctx.restore();
    }
  }

  ctx.restore();
}

function spin(){
  if(spinning || names.length===0) return;

  spinning = true;

  const winnerIndex = Math.floor(Math.random()*names.length);
  const total = names.length;
  const slice = (Math.PI*2)/total;

  const target = (Math.PI*12) + (-Math.PI/2) - (winnerIndex*slice + slice/2);

  const start = rotation;
  const change = target - start;
  const duration = 5000;
  const startTime = performance.now();

  function animate(now){
    const elapsed = now - startTime;
    const t = Math.min(elapsed/duration,1);

    rotation = start + change * (1 - Math.pow(1-t,3));
    drawWheel();

    if(t<1){
      requestAnimationFrame(animate);
    }else{
      document.getElementById('winner').innerHTML =
        '🎉 ' + names[winnerIndex] + ' 🎉';
      spinning = false;
    }
  }

  requestAnimationFrame(animate);
}

drawWheel();
</script>

</body>
</html>
